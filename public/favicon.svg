<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="tileBg" cx="34%" cy="28%" r="74%">
      <stop offset="0%" stop-color="#6d6a74" />
      <stop offset="52%" stop-color="#2a272d" />
      <stop offset="100%" stop-color="#18151a" />
    </radialGradient>
    <radialGradient id="sheen" cx="22%" cy="18%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.38" />
      <stop offset="45%" stop-color="#bec3d2" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EAA75E" stop-opacity="0.55" />
      <stop offset="55%" stop-color="#EAA75E" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#EAA75E" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Dark squircle container -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#tileBg)" />
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#sheen)" />
  <rect x="2.75" y="2.75" width="58.5" height="58.5" rx="13.25" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="1.2" />

  <!-- Core warm glow -->
  <circle cx="32" cy="32" r="20" fill="url(#coreGlow)" />

  <!-- Infinity (∞) geometric ribbon -->
  <path
    d="M 32 32 C 27 22.5, 13 22.5, 13 32 C 13 41.5, 27 41.5, 32 32 C 37 22.5, 51 22.5, 51 32 C 51 41.5, 37 41.5, 32 32 Z"
    stroke="#FFFFFF"
    stroke-opacity="0.72"
    stroke-width="1.35"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Sigma (∑) parallel geometry -->
  <path
    d="M 45.5 20 L 45.5 15.5 L 18.5 15.5 L 31.5 32 L 18.5 48.5 L 45.5 48.5 L 45.5 44"
    stroke="#FFFFFF"
    stroke-width="2.3"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M 42 18.6 L 23.8 18.6 L 34.6 32 L 23.8 45.4 L 42 45.4"
    stroke="#FFFFFF"
    stroke-opacity="0.48"
    stroke-width="0.9"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Golden-orange Fourier wave -->
  <path
    d="M 8 32 C 11.5 32, 13 22.5, 16.8 22.5 C 20.6 22.5, 22 40.5, 25.8 40.5 C 28.8 40.5, 29.8 32, 32 32 C 34.2 32, 35.2 23.5, 38.2 23.5 C 42 23.5, 43.4 41.5, 47.2 41.5 C 51 41.5, 52.5 32, 56 32"
    stroke="#EAA75E"
    stroke-width="2.1"
    stroke-linecap="round"
  />

  <!-- Key data nodes -->
  <circle cx="16.8" cy="22.5" r="2.1" fill="#EAA75E" />
  <circle cx="47.2" cy="41.5" r="2.1" fill="#EAA75E" />
  <circle cx="32" cy="32" r="3.1" fill="#EAA75E" />
  <circle cx="32" cy="32" r="1.3" fill="#FFFFFF" />
</svg>
